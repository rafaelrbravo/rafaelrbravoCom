name: Update CV

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest CV
        run: |
          curl -L "https://docs.google.com/document/d/1zUCk-GAiq06HIciky1uWirg6wPQ4cMx35u4qQ3PEONU/export?format=pdf" -o CV.pdf

      - name: Commit updated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.pdf
          git diff --cached --quiet || git commit -m "Update CV"
          git push