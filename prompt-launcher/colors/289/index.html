<!doctype html>
<html><head><meta charset="utf-8"><title>Prompt Launcher</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
</head><body>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  if (p.get("pl_prime") === "1") return;
  p.delete("pl_prime");
  p.set("pl_autosend", "1");
  const q = p.toString();
  location.replace("https://chatgpt.com/" + (q ? "?" + q : ""));
})();
</script>Opening ChatGPT…</body></html>
